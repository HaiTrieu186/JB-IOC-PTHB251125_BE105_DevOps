version: "3.9"

services:
  quickbite-db:
    image: postgres:16-alpine
    container_name: quickbite-db
    environment:
      POSTGRES_USER: ${USER_DB_USERNAME}
      POSTGRES_PASSWORD: ${USER_DB_PASSWORD}
      POSTGRES_DB: ${USER_DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - quickbite-db-data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - quickbite-net
    restart: unless-stopped

  quickbite-user:
    image: quickbite-user-service:latest
    container_name: quickbite-user
    build:
      context: ./user-service
    ports:
      - "${USER_SERVER_PORT}:${USER_SERVER_PORT}"
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${USER_DB_NAME}
      DB_USERNAME: ${USER_DB_USERNAME}
      DB_PASSWORD: ${USER_DB_PASSWORD}
      SERVER_PORT: ${USER_SERVER_PORT}
    depends_on:
      - quickbite-db
    networks:
      - quickbite-net
    restart: unless-stopped

  quickbite-restaurant:
    image: quickbite-restaurant-service:latest
    container_name: quickbite-restaurant
    build:
      context: ./restaurant-service
    ports:
      - "${RESTAURANT_SERVER_PORT}:${RESTAURANT_SERVER_PORT}"
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${RESTAURANT_DB_NAME}
      DB_USERNAME: ${RESTAURANT_DB_USERNAME}
      DB_PASSWORD: ${RESTAURANT_DB_PASSWORD}
      SERVER_PORT: ${RESTAURANT_SERVER_PORT}
    depends_on:
      - quickbite-db
    networks:
      - quickbite-net
    restart: unless-stopped

  quickbite-order:
    image: quickbite-order-service:latest
    container_name: quickbite-order
    build:
      context: ./order-service
    ports:
      - "${ORDER_SERVER_PORT}:${ORDER_SERVER_PORT}"
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${ORDER_DB_NAME}
      DB_USERNAME: ${ORDER_DB_USERNAME}
      DB_PASSWORD: ${ORDER_DB_PASSWORD}
      SERVER_PORT: ${ORDER_SERVER_PORT}
    depends_on:
      - quickbite-db
    networks:
      - quickbite-net
    restart: unless-stopped

  quickbite-notification:
    image: quickbite-notification-service:latest
    container_name: quickbite-notification
    build:
      context: ./notification-service
    ports:
      - "${NOTIFICATION_SERVER_PORT}:${NOTIFICATION_SERVER_PORT}"
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${NOTIFICATION_DB_NAME}
      DB_USERNAME: ${NOTIFICATION_DB_USERNAME}
      DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD}
      SERVER_PORT: ${NOTIFICATION_SERVER_PORT}
    depends_on:
      - quickbite-db
    networks:
      - quickbite-net
    restart: unless-stopped

networks:
  quickbite-net:
    external: true

volumes:
  quickbite-db-data: